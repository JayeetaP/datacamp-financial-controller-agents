name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --extra dev --frozen
      - run: uv run python scripts/generate_synthetic_data.py --check
      - run: uv run ruff check .
      - run: uv run pytest -m "not live and not demo_red"
      - run: uv run financial-controller eval --mode replay
